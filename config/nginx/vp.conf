server {                                                              # 顶层 server 块: 定义一个虚拟主机
    listen 80 default_server;                                          # 监听 80 端口, 并标记为默认 server(无匹配时兜底)
    server_name _;                                                     # 匹配任意 Host 头; 本板只有一个站点, 不做多域名

    # 前端静态页面根目录（改成你板上的真实路径）
    root /userdata/GrandRDK/web;                                       # 静态文件根目录指向 web/ (本板的监控页面)
    index index.html;                                                  # 默认入口文件: 访问 / 时返回 web/index.html

    # 静态页面
    location / {                                                       # 通用 location: 处理所有未明确匹配的请求
        try_files $uri $uri/ /index.html;                              # 先找真实文件 -> 找不到目录 -> 回退 SPA 入口(前端路由用)
    }

    # MJPEG 流（关键：关闭缓冲）
    location /cam1 {                                                   # /cam1 反代到 FastAPI 的 MJPEG 推流 (前视)
        proxy_pass http://127.0.0.1:5000/cam1;                         # 上游 = 本机 web_server.py 起的 5000 端口
        proxy_http_version 1.1;                                        # 用 HTTP/1.1: MJPEG 需要长连接, 1.0 默认会断开
        proxy_set_header Connection "";                                # 清掉 hop-by-hop 头: 让 Nginx 自行决定 Connection 头
        proxy_buffering off;                                           # 关闭响应缓冲: 边收边推, 否则 MJPEG 会堆很久才发
        proxy_cache off;                                               # 明确禁用缓存: 流式数据不能缓存
        proxy_read_timeout 3600s;                                      # 长读超时 1 小时: 防止 Nginx 主动断连长 MJPEG 流
        chunked_transfer_encoding on;                                  # 打开分块输出: 实时往浏览器推, 不必攒齐一帧
    }

    location /cam2 {                                                   # /cam2 反代到 FastAPI 的 MJPEG 推流 (下视), 与 /cam1 同策略
        proxy_pass http://127.0.0.1:5000/cam2;                         # 上游 = 本机 web_server.py 起的 5000 端口
        proxy_http_version 1.1;                                        # 用 HTTP/1.1: 保持长连接
        proxy_set_header Connection "";                                # 清掉 hop-by-hop 头
        proxy_buffering off;                                           # 关闭响应缓冲
        proxy_cache off;                                               # 明确禁用缓存
        proxy_read_timeout 3600s;                                      # 长读超时 1 小时
        chunked_transfer_encoding on;                                  # 打开分块输出
    }

    # REST API
    location /api/ {                                                   # /api/* 路径反代: 给上位机的状态/检测数据查询
        proxy_pass http://127.0.0.1:5000/api/;                            # 路径透传: /api/foo -> :5000/api/foo
        proxy_http_version 1.1;                                        # 用 HTTP/1.1
        proxy_set_header Host $host;                                   # 透传 Host 头: 后端若按 Host 区分服务不会被绕开
    }

    # WebSocket
    location /ws/ {                                                    # /ws/* 路径反代: WebSocket 实时状态推送
        proxy_pass http://127.0.0.1:5000/ws/;                          # 路径透传到本机 web_server.py 的 WS 端点
        proxy_http_version 1.1;                                        # WebSocket 强制 HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;                         # 透传 Upgrade 头: 触发协议升级
        proxy_set_header Connection "upgrade";                         # 把 Connection 设为 upgrade: 完成握手
        proxy_read_timeout 3600s;                                      # 长读超时: WS 连接可能要持续很久
    }
}                                                                     # 顶层 server 块结束