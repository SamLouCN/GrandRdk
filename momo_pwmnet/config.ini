# ============================================================
# RDK S100 光流演示 - 参数配置文件
# 用法: 修改下面任意参数后, 直接运行(无需任何命令行参数):
#       python3 optical_flow_demo.py       # 光流演示(选算法/可视化)
#       python3 speed_flow_demo.py         # 光流+BPU深度测速(m/s)
#       python3 flow_speed.py              # vp5.1 GPU 光流测速(共享帧, 读 [calib] 物理标定)
# 说明: 以 # 开头的行是注释, 会被程序忽略
# ============================================================

[camera]
# 摄像头编号: 0 对应 /dev/video0, 1 对应 /dev/video1
device_index = 0

# 采集分辨率(原图): 本摄像头 640x480 MJPG 支持最高 400fps(见 v4l2 --list-formats-ext)
width = 640
height = 480

# 采集帧率请求(帧/秒): 写摄像头支持的高帧率(如 120/200),
# 实际能跑多快取决于处理链, 程序会打印实测 fps
fps = 120

# 最大处理帧数: 达到后自动停止; 填 0 表示一直运行(按 q 键或 Ctrl+C 停止)
max_frames = 0

[algorithm]
# 光流算法(通过独立纯函数模块文件 algo_dense/algo_dis/algo_sparse/algo_tvl1.py 选择):
#   每个算法文件暴露统一纯函数 process(prev_gray, gray, frame, cfg, state=None)
#   -> (viz, mean_motion, moving_ratio, state); 换算法只需改 mode
mode = dis

[dense]
# ---------- Farneback 稠密光流参数(仅 mode = dense 时生效) ----------
pyr_scale = 0.5
levels = 3
winsize = 15
iterations = 3
poly_n = 5
poly_sigma = 1.2

[sparse]
# ---------- PyrLK 稀疏跟踪参数(仅 mode = sparse 时生效) ----------
max_corners = 120
quality_level = 0.01
min_distance = 8
win_size = 21
max_level = 2

[tvl1]
# ---------- DualTV-L1 稠密光流参数(仅 mode = tvl1 时生效) ----------
tau = 0.25
lambda = 0.15
nscales = 5
warps = 5
epsilon = 0.01
median_filtering = 5

[dis]
# ---------- DIS(Dense Inverse Search)稠密光流参数(仅 mode = dis 时生效) ----------
# 预设档位: 0=medium(最准但最慢) / 1=fast(推荐) / 2=ultrafast(最快)
preset = 1
# 梯度下降迭代次数: 越大质量越高但越慢(默认 16)
gradient_descent_iterations = 16

[output]
# 光流渲染图的保存路径: 填空字符串表示不保存
save_image = /tmp/flow_verify_sparse.png
# 控制台每打印一行状态间隔的帧数
log_interval = 10

[visualization]
# 是否在板端桌面(HDMI/VNC)弹出窗口实时显示; 无桌面环境时自动降级
enable_window = false
# 是否启动 Web 推流; true 后浏览器访问 http://<板卡IP>:web_port/
enable_web = true
# Web 推流端口(被占用时请改其它值)
web_port = 8000
# Web 推流 JPEG 画质(1~100)
mjpg_quality = 80

[motion]
# 判断"有运动"的速度阈值(像素/帧, 按原图分辨率计): 静止噪点伪位移一般 <1px
motion_threshold = 1.2
# 光流计算前的帧平滑核大小(奇数, 1=关闭): 抑噪; 画面越暗噪越大用越大
blur_ksize = 5
# 运动像素占比低于该值时判定"静止", 速度直接置 0
min_motion_ratio = 0.05
texture_threshold = 12.0

[depth]
# ---------- [DEPRECATED 2026-09-07] 单目深度测速参数 ----------
# ⚠️ vp5.1 flow_speed.py(GPU 光流版) 已彻底移除深度链路:
#   - DepthSpeedMeter / DAV2 / depth_any.hbm 不再加载
#   - BPU 全部让给 vp5.1 双 YOLO
#   - 速度输出 = 图像平面速度 px/帧 + moving%(无真实尺度)
# 本段仅供历史回放与独立演示 speed_flow_demo.py 读取, vp5.1 run.sh 链路不读它。
enable = false
model_path = /userdata/momo_pwmnet/depth/model/depth_any.hbm
interval_frames = 20
depth_a = 1.0
depth_b = 0.0

[speed]
# ---------- 测速换算参数(flow_speed.py 使用, 无深度) ----------
# 光流处理尺度(0~1): 1=原分辨率算(最慢) / 0.5=半分辨率(约快4倍)
# 光流在半分辨率算, 换算回原图像素位移, 不影响速度公式
process_scale = 0.5
# (DEPRECATED)相机焦距(像素): 物理速度换算已移交 [calib] 段, 本字段不再使用。
focal_px = 457.0
# real_fps 已弃用: 速度换算改用实测帧间隔 dt(见代码), 无需再填
real_fps = 30.0
# 可选: 像素->米 的显示近似常数(仅用于 Web 画面叠加, 无物理意义, 非标定 m/s)
# 0 = 不显示该项; 设值仅作显示近似(如 0.003), 文档明确非标定
px_to_m = 0.0

[calib]
# ============================================================
# 物理速度标定 [calib] —— 用光流反算相机本身相对场景的运动速度(m/s)
# ============================================================
# 原理(针孔模型, 相机平移 ⊥ 光轴、场景近似为距离 range_m 的平面):
#   v(m/s) = 像素速度(px/帧) × (range_m / focal_px) / 帧间隔(dt)
#   range_m/focal_px = 每个像素对应的真实距离(m/px), 即"尺度"
#
# 适用前提(重要):
#   1) 相机以横移/漂移为主, 或场景为近似垂直于光轴的平面;
#   2) 沿光轴前进(前向接近)属于扩展光流, 单一尺度公式不适用, 需要测距模型;
#   3) 绕光轴旋转会产生额外光流污染平移估计, 精度要求高时需 IMU/陀螺仪补偿。
#   当前实现按"平移为主"近似, 输出为近似 m/s。
#
# 真实标定方法(后续用真值替换下面两个参数即可):
#   - focal_px: OpenCV 棋盘格标定 (cv2.calibrateCamera) 直接给出 fx;
#     或按相机 datasheet 水平 FOV 换算: fx = (W/2) / tan(HFOV/2)。
#   - range_m: 相机光心到场景平面的距离(米)。下视 = 离地高度;
#     前视 = 到前方目标/海底平面的距离, 用激光测距/声呐/已知高度实测。
#   - 有 IMU 时: 用旋转补偿后的光流再入公式, 精度更高。
#
# 当前值即"常见数据占位标定":
#   focal_px ≈ 554 (640x480 相机, HFOV≈60° 常见值: 320/tan(30°)),
#   range_m = 1.0 (水下 ROV 常见作业高度/目标距离)。
#   ⚠️ 这是占位近似, 非真实标定值; 输出会持续标注; 请标定后替换。

# 物理标定总开关: true = 按下方标定参数换算并输出 m/s(同时保留 px/帧);
# false = 保持原行为(只输出 px/帧 + moving%, 完全无物理尺度)
enable = true

# 相机等效焦距(像素): 常见占位 554.0, 真实标定后替换(见上)
focal_px = 554.0

# 相机光心到场景平面的距离(米): 常见占位 1.0, 真实标定后替换(见上)
range_m = 1.0

# 标定来源说明(自由文本, 仅启动日志展示, 方便回溯当前值是否真实标定)
source = placeholder_common_values(待真实标定替换)

# 帧率换算: false(推荐)= 用实测帧间隔 dt 换算(最准);
# true = 用固定 nominal_fps 换算(仅当测速帧率被 --fps 稳定限定时可省事)
use_nominal_fps = false
nominal_fps = 50.0
